# Change between "lt" or "hybrid"
improver: lt

lt:
  lang: fr
  server:
    host: 127.0.0.1
    port: 8081
    jar_path: resources/languagetool/languagetool-server.jar
    jre_bin: java
    allow_origin: "*"
    heap_mb: 768
  client:
    ping_timeout_s: 5
    request_timeout_s: 25
    check_retries: 0
    retry_backoff_s: 0.3
    fail_open: true
    max_chars: 2500
    cache_size: 128

llm:
  # Model to use: "mistral-7b-q4" or "gemma3-4b"
  model: mistral-7b-q4
  models_dir: resources/models
  validate_with_lt_after: false
  
  mistral:
    filename: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
    n_ctx: 2048 # DYS texts are usually short; lower context improves latency
    max_tokens: 320 # Enough for correction output while reducing generation time
    temperature: 0.3 # Reduced: more conservative, less unnecessary creativity
    validate_with_lt_after: false
    
  gemma:
    model_name: "gemma3:4b"  # Must match 'ollama list' -> ollama list
    temperature: 0.1
    num_ctx: 2048
    num_predict: 256
    top_p: 0.9
    validate_with_lt_after: false

spacy:
  model: fr_core_news_md
  only_ner_pos: true
  target_dir: resources/spacy
  add_date_ruler: true
