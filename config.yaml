app:
  host: 127.0.0.1
  port: 8501
  open_browser: true

# Change between "lt" or "hybrid"
improver: lt

lt:
  lang: fr
  server:
    host: 127.0.0.1
    port: 8081
    jar_path: resources/languagetool/languagetool-server.jar
    jre_bin: auto
    allow_origin: "*"
    heap_mb: 256

llm:
  # Model to use: "mistral-7b-q4" or "gemma3-4b"
  model: mistral-7b-q4
  models_dir: resources/models

  # Models the application can fetch on demand. The installer ships no GGUF; a user
  # config at %LOCALAPPDATA%\DYS-fr\config.yaml can override url/sha256 if the
  # upstream file is ever replaced.
  downloads:
    - id: mistral-7b-q4
      display_name: Mistral 7B Instruct v0.3 (Q4_K_M)
      filename: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
      url: https://huggingface.co/bartowski/Mistral-7B-Instruct-v0.3-GGUF/resolve/main/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
      size_bytes: 4372812000
      sha256: 1270d22c0fbb3d092fb725d4d96c457b7b687a5f5a715abe1e818da303e562b6
      min_ram_gb: 8

  mistral:
    filename: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
    n_ctx: 4096
    max_tokens: 526
    temperature: 0.3

  gemma:
    model_name: "gemma3:4b"
    timeout: 120
    temperature: 0.1

spacy:
  model: fr_core_news_md
  only_ner_pos: true
  target_dir: resources/spacy
  add_date_ruler: true
